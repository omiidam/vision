// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Point every module - including the Capacitor libraries under node_modules, which we
    // must not edit - at the build-tools revision named in variables.gradle, instead of the
    // Android Gradle Plugin's default, which is not installed on every machine.
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.buildToolsVersion rootProject.ext.buildToolsVersion
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
